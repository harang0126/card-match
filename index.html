<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 맞추기</title>
<style>
:root{--bg:#ffd6d6;--fg:#4a1624;--sub:#7a3040;--card:#fff7f7;--line:#e8b4b4;--accent:#8a2a40;--hov:#fff;--ok:#1f7a46;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#24100f;--fg:#f6e3e7;--sub:#d9a9b4;--card:#3a1b24;--line:#5c2e3b;--accent:#e58aa5;--hov:#2a1218;--ok:#6fd49a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.hide{display:none!important}
.back{background:radial-gradient(circle at 50% 50%,rgba(212,175,55,.3) 0 13%,transparent 14%),repeating-linear-gradient(45deg,transparent 0 9px,rgba(212,175,55,.22) 9px 10px),repeating-linear-gradient(-45deg,transparent 0 9px,rgba(212,175,55,.22) 9px 10px),linear-gradient(160deg,#4a1226,#1f0812);box-shadow:inset 0 0 0 4px #1f0812,inset 0 0 0 5px #d4af37,inset 0 0 0 8px #1f0812,inset 0 0 0 9px rgba(212,175,55,.55);position:relative}
.back::after{content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);border:1.5px solid #d4af37;background:#2a0a16;box-shadow:0 0 0 3px #2a0a16,0 0 0 4px rgba(212,175,55,.7)}
.back::before{content:"";position:absolute;left:50%;top:50%;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#f6e3a1,#c9a24a);z-index:1}
#title{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.fan{display:flex;justify-content:center;height:130px;margin-bottom:6px}
.mini{width:84px;aspect-ratio:3/4;border-radius:8px;margin:0 -14px;transform-origin:50% 120%}
.mini:nth-child(1){transform:rotate(-14deg)}.mini:nth-child(3){transform:rotate(14deg)}
#title h1{font-size:2.2rem;margin:0;letter-spacing:.04em}
#title p{margin:0;font-size:1rem;color:var(--sub)}
.lv{display:flex;flex-direction:column;gap:10px;width:min(280px,100%);margin-top:10px}
.lv button{padding:13px;border-radius:12px;border:1.5px solid var(--accent);background:var(--card);color:var(--fg);font-size:1.05rem;font-weight:600}
.lv button:hover{background:var(--accent);color:var(--hov)}
#game{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:1100px;margin:0 auto;padding:10px 12px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px}
.top button,.act button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 14px;border-radius:10px}
#lvname{font-weight:700}
.stats{display:flex;justify-content:center;gap:18px;font-size:.92rem;height:28px;align-items:center}
.stats b{font-variant-numeric:tabular-nums}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#board{display:grid;justify-content:center}
.card{aspect-ratio:3/4;width:100%;perspective:700px;border:0;padding:0;background:none}
.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden}
.f{transform:rotateY(180deg);background:var(--card);border:1px solid var(--line)}
.f img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(1.35) contrast(1.1) saturate(1.15)}
.card.done .f{box-shadow:0 0 0 3px var(--ok) inset}
#msg{text-align:center;font-size:1.05rem;height:26px;line-height:26px;color:var(--ok);font-weight:600}
.best{text-align:center;font-size:.8rem;opacity:.75;height:16px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
#home2.hide{display:inline-block!important;visibility:hidden}
</style>
</head>
<body>
<section id="title">
<div class="fan"><div class="mini back"></div><div class="mini back"></div><div class="mini back"></div></div>
<h1>카드 맞추기</h1>
<p>같은 그림의 카드 두 장을 찾아 모두 맞춰 보세요.</p>
<div class="lv" id="levels"></div>
</section>
<section id="game" class="hide">
<div class="top"><button id="home">← 처음으로</button><span id="lvname"></span><span style="width:96px"></span></div>
<div class="stats"><span>시도 <b id="moves">0</b></span><span>맞춘 짝 <b id="pairs">0</b></span><span>시간 <b id="time">0</b>초</span></div>
<div id="wrap"><div id="board"></div></div>
<div id="msg"></div>
<div class="best" id="best"></div>
<div class="act"><button id="restart">다시 섞기</button><button id="home2" class="hide">처음으로</button></div>
</section>

function setBest(v){try{localStorage.setItem(bestKey(),v)}catch(e){}}
function showBest(){const b=getBest();$('best').textContent=b?'최고 기록: '+b.split('|')[0]:''}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
LEVELS.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l.k;b.onclick=()=>{lv=i;show(true);start()};$('levels').appendChild(b)});
function show(g){$('title').classList.toggle('hide',g);$('game').classList.toggle('hide',!g);window.scrollTo(0,0)}
$('home').onclick=()=>{clearInterval(timer);show(false)};
function fit(){
 if($('game').classList.contains('hide'))return;
 const N=LEVELS[lv].cards,wrap=$('wrap'),W=wrap.clientWidth,H=wrap.clientHeight,gap=W<700?5:10;
 let bw=0,bc=2;
 for(let c=2;c<=N/2;c++){if(N%c)continue;const r=N/c;
  const w=Math.min((W-gap*(c-1))/c,((H-gap*(r-1))/r)*3/4,190);
  if(w>bw){bw=w;bc=c}}
 const bd=$('board');bd.style.gap=gap+'px';bd.style.gridTemplateColumns='repeat('+bc+','+Math.max(24,Math.floor(bw*0.8))+'px)';
}
function start(){
 clearInterval(timer);sec=0;started=false;sel=[];lock=false;moves=0;found=0;
 const pairs=LEVELS[lv].cards/2,pool=shuffle(IMAGES.slice()),deck=[];
 for(let i=0;i<pairs;i++){const im=pool[i%pool.length];deck.push(im,im)}
 shuffle(deck);
 const bd=$('board');bd.innerHTML='';
 deck.forEach(im=>{const c=document.createElement('button');c.className='card';c.dataset.id=im.id;c.setAttribute('aria-label','카드');
  c.innerHTML='<div class="in"><div class="b back"></div><div class="f"><img alt="'+im.n+'" src="'+im.src+'"></div></div>';
  c.onclick=()=>pick(c);bd.appendChild(c)});
 $('home2').classList.add('hide');$('home').style.visibility='';
 $('lvname').textContent=LEVELS[lv].k;$('moves').textContent=0;$('pairs').textContent=0;$('time').textContent=0;$('msg').textContent='';showBest();
 fit();
}
function pick(c){
 if(lock||c.classList.contains('flip')||c.classList.contains('done'))return;
 if(!started){started=true;timer=setInterval(()=>{sec++;$('time').textContent=sec},1000)}
 c.classList.add('flip');sel.push(c);
 if(sel.length<2)return;
 moves++;$('moves').textContent=moves;
 if(sel[0].dataset.id===sel[1].dataset.id){
  sel.forEach(x=>x.classList.replace('flip','done'));sel=[];found++;$('pairs').textContent=found;
  if(found===LEVELS[lv].cards/2)win();
 }else{lock=true;const a=sel;sel=[];setTimeout(()=>{a.forEach(x=>x.classList.remove('flip'));lock=false},800)}
}
function win(){
 clearInterval(timer);
 const rec=sec+'초 / '+moves+'회',score=sec+moves*2,old=getBest();let t='🎉 완료! '+rec;
 if(old===null||score<parseInt(old.split('|')[1],10)){setBest(rec+'|'+score);t+=' · 신기록!'}
 $('msg').textContent=t;showBest();$('home2').classList.remove('hide');$('home').style.visibility='hidden';
}
$('restart').onclick=start;$('home2').onclick=$('home').onclick;
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
</script>
</body>
